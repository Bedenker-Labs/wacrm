name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/bedenker-labs/wacrm
          tags: |
            type=sha
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: reybritez
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # fsn1-3 (donde corre esto) es arm64, igual que el Swarm.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://supabase.bedenkerlabs.com
            NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkxNDU5NDU2LCJleHAiOjE5NDkxMzk0NTZ9.xYtAAUz1CNQjXxZ2z3G5Ob7bbs8tgyKTj2cbQNFnya4
            NEXT_PUBLIC_SITE_URL=https://wacrm.bedenkerlabs.com
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
